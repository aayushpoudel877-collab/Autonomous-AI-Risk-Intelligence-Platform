[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind"
version = "0.2.0"
description = "Autonomous multimodal AI risk intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]
deep-learning = ["torch>=2.3,<3"]
nlp = ["transformers>=4.45,<5", "torch>=2.3,<3"]
vision = ["torchvision>=0.18,<1", "torch>=2.3,<3"]
full-ml = ["torch>=2.3,<3", "transformers>=4.45,<5", "torchvision>=0.18,<1]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
