services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://aegismind:aegismind@postgres:5432/aegismind
    depends_on: [postgres, redis]
  worker:
    build: .
    command: celery -A workers.tasks.celery_app worker --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on: [redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegismind
      POSTGRES_USER: aegismind
      POSTGRES_PASSWORD: aegismind
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
