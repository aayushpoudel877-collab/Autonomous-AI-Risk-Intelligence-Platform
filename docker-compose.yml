services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegismind
      POSTGRES_USER: aegismind
      POSTGRES_PASSWORD: aegismind
    ports: ["5432:5432"]
  postgres:
    image: postgres:16-alpine
